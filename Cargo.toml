[package]
name = "agent-guard"
version = "0.4.2"
description = "A local security layer for AI coding agents: checks every tool call, keeps keys from leaking, shows what your agents send out."
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/defi0x1/agent-guard"
readme = "README.md"
keywords = ["security", "ai-agents", "claude-code", "mcp", "hooks"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "guard"
path = "src/main.rs"

[[bin]]
name = "agent-guard"
path = "src/bin/agent-guard.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
netstat2 = "0.11"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
sysinfo = { version = "0.36", default-features = false, features = ["system"] }
tempfile = "3"
thiserror = "2"
toml = "1.2"
url = "2"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
